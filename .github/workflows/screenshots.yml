# The three JetBrains Marketplace listing screenshots (SCREENSHOTS.md), taken in a real IntelliJ IDEA Community with
# this plugin on a virtual 1280 x 800 screen (Xvfb). Started by hand only (Actions > screenshots > Run workflow).
# Uses no secrets and publishes nothing: the PNGs are a run artifact named listing-screenshots.
#
# How: `gradle runIdeForUiTests` (build.gradle.kts) starts the IDE with JetBrains' Robot Server plugin and opens a
# small demo project made below; screenshots/ is a separate Gradle build that drives the IDE through Remote-Robot.
name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The CLI this plugin bundles
        run: npm install --no-save --no-audit --no-fund --no-package-lock "@yof/cli@$(sed -n 's/^yofCliVersion *= *//p' gradle.properties)"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: A virtual 1280 x 800 screen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          Xvfb :99 -screen 0 1280x800x24 -ac -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 3
      # The demo project. The Stripe-style keys are made up here, in two pieces so no key pattern is in this file,
      # and have never worked anywhere. The editor folds all but their first 12 characters before each screenshot.
      - name: The demo project
        run: |
          demo="$RUNNER_TEMP/yof-demo"
          mkdir -p "$demo/src" "$RUNNER_TEMP/later"
          live="sk_""live_51QyofDemoKeyNeverIssued4Kz9"
          testkey="sk_""test_51QyofDemoTestKeyNeverIssued7Hd"
          printf '{\n  "name": "yof-demo",\n  "private": true,\n  "type": "module"\n}\n' > "$demo/package.json"
          {
            echo '// yof demo: the key on line 3 is made up for a screenshot and has never worked.'
            echo 'export const currency = "usd";'
            echo "export const stripeSecretKey = \"$live\";"
            echo ''
            echo 'export function checkoutUrl(orderId: string): string {'
            echo '  return `/checkout/${orderId}`;'
            echo '}'
          } > "$demo/src/config.ts"
          {
            echo '// yof demo: a made-up Stripe test key, added for the third screenshot.'
            echo "export const stripeTestKey = \"$testkey\";"
          } > "$RUNNER_TEMP/later/payments.ts"
          echo "YOF_UI_PROJECT=$demo" >> "$GITHUB_ENV"
          echo "YOF_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Start the IDE
        run: nohup gradle runIdeForUiTests > "$RUNNER_TEMP/ide.log" 2>&1 &
      - name: Wait for the Robot Server
        run: |
          for i in $(seq 1 120); do
            if curl -fs -o /dev/null http://127.0.0.1:8082; then echo "Robot Server up after $((i * 10)) s"; exit 0; fi
            sleep 10
          done
          echo "The IDE did not start; last lines of its Gradle log:"; tail -n 80 "$RUNNER_TEMP/ide.log"; exit 1
      - name: Take the screenshots
        run: gradle -p screenshots run --args="$GITHUB_WORKSPACE/listing-screenshots $RUNNER_TEMP/later/payments.ts"
      - name: Check the size of each screenshot
        run: |
          sudo apt-get install -y -q imagemagick > /dev/null
          for f in listing-screenshots/0*.png; do
            size=$(identify -format '%wx%h' "$f"); echo "$f $size"; test "$size" = "1280x800"
          done
          test "$(ls listing-screenshots/0*.png | wc -l)" = 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-screenshots
          path: listing-screenshots/
          retention-days: 30
      - name: Collect the IDE logs
        if: always()
        run: |
          mkdir -p ide-logs
          cp "$RUNNER_TEMP/ide.log" "$RUNNER_TEMP/xvfb.log" ide-logs/ 2>/dev/null || true
          find build/idea-sandbox -name 'idea.log' -exec cp --backup=numbered {} ide-logs/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-logs
          path: ide-logs/
          retention-days: 7
